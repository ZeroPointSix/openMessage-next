name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install / check / test / deps
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openmessage_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBMATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/openmessage_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/openmessage_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format and typecheck
        run: pnpm check
      - name: User Web quality gates
        run: pnpm --filter @openmessage/user-web check && pnpm --filter @openmessage/user-web test && pnpm --filter @openmessage/user-web build
      - name: Migrate clean database twice
        run: pnpm db:migrate && pnpm db:migrate
      - name: Unit tests
        run: pnpm test:unit
      - name: Cucumber E2E
        run: pnpm test:e2e
      - name: Dependency boundaries
        run: pnpm deps:validate

  docker-smoke:
    name: Docker build / smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build image
        run: docker build -t openmessage-next:ci .
      - name: Build User Web image
        run: docker build -f apps/user-web/Dockerfile -t openmessage-user-web:ci .
      - name: Start container
        run: >-
          docker run -d --name app -p 3000:3000
          -e NODE_ENV=production -e LOG_LEVEL=warn
          -e POSTGRES_URL=127.0.0.1:1 -e POSTGRES_USER=ci
          -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci
          openmessage-next:ci
      - name: Health check
        run: >-
          curl --fail --retry 30 --retry-delay 1
          --retry-connrefused --retry-all-errors
          http://localhost:3000/health
      - name: Container logs
        if: always()
        run: docker logs app
